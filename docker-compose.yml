services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://kanban:kanban@db:5432/kanban
      AuthClientId: ${AuthClientId}
      AuthClientSecret: ${AuthClientSecret}
      AuthAuthority: ${AuthAuthority}
      AuthCallbackUrl: ${AuthCallbackUrl}
      BASE_URL: ${BASE_URL:-http://localhost}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      AGENT_DEFAULT_BASE_URL: ${AGENT_DEFAULT_BASE_URL:-https://routerai.ru/api/v1}
      AGENT_DEFAULT_MODEL: ${AGENT_DEFAULT_MODEL:-openai/gpt-4.1-nano}
      AGENT_DEFAULT_API_KEY: ${AGENT_DEFAULT_API_KEY:-}
      AGENT_MAX_RUN_MINUTES: ${AGENT_MAX_RUN_MINUTES:-120}
      AGENT_LLM_TIMEOUT_SECONDS: ${AGENT_LLM_TIMEOUT_SECONDS:-120}
      AGENT_LLM_RETRIES: ${AGENT_LLM_RETRIES:-4}
      AGENT_CONTEXT_WINDOW_TOKENS: ${AGENT_CONTEXT_WINDOW_TOKENS:-200000}
      AGENT_CONTEXT_SUMMARY_THRESHOLD: ${AGENT_CONTEXT_SUMMARY_THRESHOLD:-0.3}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
